[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satori"
version = "0.1.0"
description = "A step-by-step computational drug discovery project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rdkit>=2024.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
